name: EAIOS CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-ci:
    name: Backend Lint, Test & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pip-audit
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Run Python Linter (Ruff)
        run: |
          ruff check backend/

      - name: Run Pytest
        run: |
          pytest backend/

      - name: Security Vulnerability Scan (pip-audit)
        run: |
          pip-audit -r backend/requirements.txt --desc on --ignore-vuln PYSEC-2026-1325

  frontend-ci:
    name: Frontend Lint, Build & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package.json"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Run Frontend Linter & Build
        working-directory: ./frontend
        run: |
          npm run lint --if-present
          npm run build

      - name: Security Vulnerability Scan (npm audit)
        working-directory: ./frontend
        run: npm audit --audit-level=high
