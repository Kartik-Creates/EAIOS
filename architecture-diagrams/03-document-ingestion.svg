<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 340" width="1160" height="340" color="#171B24">
  <title>UnifyAI — Getting Documents In</title>
  <desc>Two separate paths — a manual document upload, and an automatic Google Drive sync job — both extract and chunk text, then converge on one shared embedding step, before being stored together as documents and chunks with vectors in pgvector, which is what the chat's document search reads from.</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .n-box { fill: #FFFFFF; stroke: #171B24; stroke-width: 1.4; }
    .n-key { fill: #EEF0FE; stroke: #4338CA; stroke-width: 1.6; }
    .n-terminal { fill: #EEF0FE; stroke: #4338CA; stroke-width: 1.6; }
    .e-line { stroke: #171B24; stroke-width: 1.3; fill: none; }
    .e-key { stroke: #4338CA; stroke-width: 1.6; fill: none; }
    .lbl { fill: #171B24; font-family: "IBM Plex Sans", sans-serif; }
    .lbl-title { fill: #171B24; font-family: "IBM Plex Sans", sans-serif; font-weight: 600; }
    .lbl-mono { fill: #5B6472; font-family: "IBM Plex Mono", monospace; }
    .lane-head { fill: #5B6472; font-family: "IBM Plex Mono", monospace; letter-spacing: .06em; }
  </style>
  <defs>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
    <marker id="arrowCKey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4338CA" />
    </marker>
  </defs>

  <text class="lane-head" x="40" y="24" font-size="10.5">PATH A — MANUAL</text>
  <rect class="n-box" x="40" y="34" width="220" height="56" rx="6"/>
  <text class="lbl" x="150" y="58" text-anchor="middle" font-size="12">Admin uploads</text>
  <text class="lbl" x="150" y="76" text-anchor="middle" font-size="12">a document</text>

  <line class="e-line" x1="260" y1="62" x2="308" y2="62" marker-end="url(#arrowC)"/>
  <rect class="n-box" x="310" y="34" width="220" height="56" rx="6"/>
  <text class="lbl" x="420" y="58" text-anchor="middle" font-size="12">Extract text &amp;</text>
  <text class="lbl" x="420" y="76" text-anchor="middle" font-size="12">split into chunks</text>

  <text class="lane-head" x="40" y="214" font-size="10.5">PATH B — GOOGLE DRIVE SYNC</text>
  <rect class="n-box" x="40" y="224" width="220" height="56" rx="6"/>
  <text class="lbl" x="150" y="248" text-anchor="middle" font-size="12">Drive sync job runs</text>
  <text class="lbl" x="150" y="266" text-anchor="middle" font-size="11">(user's Drive OAuth token)</text>

  <line class="e-line" x1="260" y1="252" x2="308" y2="252" marker-end="url(#arrowC)"/>
  <rect class="n-box" x="310" y="224" width="220" height="56" rx="6"/>
  <text class="lbl" x="420" y="248" text-anchor="middle" font-size="12">List / download files,</text>
  <text class="lbl" x="420" y="266" text-anchor="middle" font-size="12">extract &amp; chunk</text>

  <path class="e-key" d="M 530 62 L 590 62 L 660 150" fill="none" marker-end="url(#arrowCKey)"/>
  <path class="e-key" d="M 530 252 L 590 252 L 660 164" fill="none" marker-end="url(#arrowCKey)"/>

  <rect class="n-key" x="660" y="122" width="240" height="60" rx="6"/>
  <text class="lbl-title" x="780" y="147" text-anchor="middle" font-size="12.5">Embed each chunk</text>
  <text class="lbl-mono" x="780" y="165" text-anchor="middle" font-size="10.5">Ollama or Gemini</text>

  <line class="e-line" x1="900" y1="152" x2="948" y2="152" marker-end="url(#arrowC)"/>
  <rect class="n-box" x="950" y="112" width="200" height="80" rx="6"/>
  <text class="lbl-title" x="1050" y="140" text-anchor="middle" font-size="12">Store as Document</text>
  <text class="lbl-title" x="1050" y="158" text-anchor="middle" font-size="12">+ Chunk + vector</text>
  <text class="lbl-mono" x="1050" y="178" text-anchor="middle" font-size="10.5">pgvector</text>

  <line class="e-line" x1="1050" y1="192" x2="1050" y2="230" marker-end="url(#arrowC)"/>
  <rect class="n-terminal" x="950" y="232" width="200" height="60" rx="6"/>
  <text class="lbl-title" x="1050" y="257" text-anchor="middle" font-size="12">Available to chat's</text>
  <text class="lbl-title" x="1050" y="275" text-anchor="middle" font-size="12">document search</text>
</svg>
