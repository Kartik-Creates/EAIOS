<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" width="1120" height="780" color="#171B24">
  <title>UnifyAI — System Working Flowchart</title>
  <desc>A message comes in. If it's a casual greeting, the model replies warmly and stops there. Otherwise the model figures out which tool fits: a connected app, company documents, or neither — which falls back to a document search anyway and merges into the same pgvector step. Whichever path it takes, Gemini writes the answer, which is shown to the user with its source.</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .n-box { fill: #FFFFFF; stroke: #171B24; stroke-width: 1.4; }
    .n-diamond { fill: #FFFFFF; stroke: #171B24; stroke-width: 1.4; }
    .n-terminal { fill: #EEF0FE; stroke: #4338CA; stroke-width: 1.6; }
    .e-line { stroke: #171B24; stroke-width: 1.3; fill: none; }
    .e-dashed { stroke: #5B6472; stroke-width: 1.2; fill: none; stroke-dasharray: 5 5; }
    .lbl { fill: #171B24; font-family: "IBM Plex Sans", sans-serif; }
    .lbl-title { fill: #171B24; font-family: "IBM Plex Sans", sans-serif; font-weight: 600; }
    .lbl-edge { fill: #3A4051; font-family: "IBM Plex Mono", monospace; }
  </style>
  <defs>
    <marker id="arrowF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- 1. start -->
  <rect class="n-box" x="420" y="20" width="280" height="56" rx="6"/>
  <text class="lbl-title" x="560" y="53" text-anchor="middle" font-size="13.5">A message comes in from someone</text>

  <line class="e-line" x1="560" y1="76" x2="560" y2="106" marker-end="url(#arrowF)"/>

  <!-- 2. diamond -->
  <polygon class="n-diamond" points="560,90 670,150 560,210 450,150"/>
  <text class="lbl" x="560" y="146" text-anchor="middle" font-size="12.5">Just a</text>
  <text class="lbl" x="560" y="162" text-anchor="middle" font-size="12.5">greeting?</text>

  <line class="e-line" x1="670" y1="150" x2="698" y2="150" marker-end="url(#arrowF)"/>
  <text class="lbl-edge" x="684" y="141" text-anchor="middle" font-size="11">yes</text>
  <rect class="n-terminal" x="700" y="122" width="230" height="56" rx="6"/>
  <text class="lbl-title" x="815" y="146" text-anchor="middle" font-size="13">Reply warmly —</text>
  <text class="lbl-title" x="815" y="164" text-anchor="middle" font-size="13">done!</text>

  <line class="e-line" x1="560" y1="210" x2="560" y2="240" marker-end="url(#arrowF)"/>
  <text class="lbl-edge" x="578" y="230" font-size="11">no</text>

  <!-- 3. which tool fits -->
  <rect class="n-box" x="430" y="242" width="260" height="60" rx="6"/>
  <text class="lbl" x="560" y="266" text-anchor="middle" font-size="13">Model figures out</text>
  <text class="lbl" x="560" y="286" text-anchor="middle" font-size="13">which tool fits</text>

  <!-- fan out -->
  <line class="e-line" x1="500" y1="302" x2="205" y2="336" marker-end="url(#arrowF)"/>
  <line class="e-line" x1="560" y1="302" x2="560" y2="336" marker-end="url(#arrowF)"/>
  <line class="e-line" x1="620" y1="302" x2="915" y2="336" marker-end="url(#arrowF)"/>

  <!-- row: 3 branches -->
  <rect class="n-box" x="50" y="338" width="290" height="86" rx="6"/>
  <text class="lbl" x="195" y="362" text-anchor="middle" font-size="12.5">An app —</text>
  <text class="lbl" x="195" y="382" text-anchor="middle" font-size="12.5">Gmail · Jira · Drive ·</text>
  <text class="lbl" x="195" y="402" text-anchor="middle" font-size="12.5">Calendar · GitHub · Slack</text>

  <rect class="n-box" x="420" y="338" width="280" height="86" rx="6"/>
  <text class="lbl-title" x="560" y="374" text-anchor="middle" font-size="13.5">Company</text>
  <text class="lbl-title" x="560" y="394" text-anchor="middle" font-size="13.5">documents</text>

  <rect class="n-box" x="780" y="338" width="290" height="86" rx="6"/>
  <text class="lbl" x="925" y="374" text-anchor="middle" font-size="12.5">Not sure /</text>
  <text class="lbl" x="925" y="394" text-anchor="middle" font-size="12.5">none of these fit</text>

  <!-- row -> row2 -->
  <line class="e-dashed" x1="195" y1="424" x2="195" y2="454" marker-end="url(#arrowF)"/>
  <line class="e-dashed" x1="560" y1="424" x2="560" y2="454" marker-end="url(#arrowF)"/>
  <line class="e-line" x1="925" y1="424" x2="930" y2="454" marker-end="url(#arrowF)"/>

  <!-- row2: what actually happens -->
  <rect class="n-box" x="70" y="456" width="250" height="62" rx="6"/>
  <text class="lbl" x="195" y="482" text-anchor="middle" font-size="12">Calls that app's</text>
  <text class="lbl" x="195" y="500" text-anchor="middle" font-size="12">real API</text>

  <rect class="n-box" x="420" y="456" width="280" height="62" rx="6"/>
  <text class="lbl" x="560" y="482" text-anchor="middle" font-size="12">Searches pgvector</text>
  <text class="lbl" x="560" y="500" text-anchor="middle" font-size="12">(Supabase)</text>

  <rect class="n-box" x="790" y="456" width="280" height="62" rx="6"/>
  <text class="lbl" x="930" y="482" text-anchor="middle" font-size="12">Try the document</text>
  <text class="lbl" x="930" y="500" text-anchor="middle" font-size="12">search anyway</text>

  <!-- fallback merges into pgvector -->
  <line class="e-line" x1="790" y1="487" x2="702" y2="487" marker-end="url(#arrowF)"/>
  <text class="lbl-edge" x="746" y="513" text-anchor="middle" font-size="10.5">(same search)</text>

  <!-- row2 -> Gemini -->
  <line class="e-line" x1="195" y1="518" x2="470" y2="562" marker-end="url(#arrowF)"/>
  <line class="e-line" x1="560" y1="518" x2="560" y2="562" marker-end="url(#arrowF)"/>

  <!-- Gemini writes the answer -->
  <rect class="n-box" x="430" y="564" width="280" height="64" rx="6"/>
  <text class="lbl-title" x="570" y="590" text-anchor="middle" font-size="13.5">Gemini writes</text>
  <text class="lbl-title" x="570" y="610" text-anchor="middle" font-size="13.5">the answer</text>

  <line class="e-line" x1="570" y1="628" x2="575" y2="658" marker-end="url(#arrowF)"/>

  <!-- final -->
  <rect class="n-terminal" x="440" y="660" width="280" height="64" rx="6"/>
  <text class="lbl-title" x="580" y="686" text-anchor="middle" font-size="13.5">Answer + source</text>
  <text class="lbl-title" x="580" y="706" text-anchor="middle" font-size="13.5">shown to you</text>
</svg>
