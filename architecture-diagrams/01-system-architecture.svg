<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" width="1080" height="580" color="#171B24">
  <title>UnifyAI — System Architecture</title>
  <desc>The browser calls the FastAPI backend over HTTPS with a JWT; the backend makes five distinct outbound calls — to Postgres with pgvector, to Redis, to the Gemini API, to Ollama, and to the six connected apps' own APIs using each user's stored OAuth token.</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .n-box { fill: #FFFFFF; stroke: #171B24; stroke-width: 1.4; }
    .n-external { fill: #EEF0FE; stroke: #4338CA; stroke-width: 1.4; }
    .e-line { stroke: #171B24; stroke-width: 1.3; fill: none; }
    .e-key { stroke: #4338CA; stroke-width: 1.6; fill: none; }
    .lbl-title { fill: #171B24; font-family: "IBM Plex Sans", sans-serif; font-weight: 600; }
    .lbl-mono { fill: #5B6472; font-family: "IBM Plex Mono", monospace; }
    .lbl-edge { fill: #3A4051; font-family: "IBM Plex Mono", monospace; }
  </style>
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
    <marker id="arrowAKey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4338CA" />
    </marker>
  </defs>

  <rect class="n-box" x="30" y="256" width="200" height="64" rx="6"/>
  <text class="lbl-title" x="130" y="282" text-anchor="middle" font-size="13.5">Browser</text>
  <text class="lbl-mono" x="130" y="300" text-anchor="middle" font-size="11">React + Vite · Vercel</text>

  <line class="e-line" x1="230" y1="288" x2="332" y2="288" marker-end="url(#arrowA)"/>
  <text class="lbl-edge" x="281" y="278" text-anchor="middle" font-size="11">HTTPS + JWT</text>

  <rect class="n-box" x="340" y="40" width="240" height="496" rx="6"/>
  <text class="lbl-title" x="460" y="278" text-anchor="middle" font-size="14.5">FastAPI Backend</text>
  <text class="lbl-mono" x="460" y="296" text-anchor="middle" font-size="11">Render</text>
  <text class="lbl-mono" x="460" y="316" text-anchor="middle" font-size="10.5">routers → services → data</text>

  <line class="e-line" x1="580" y1="72" x2="738" y2="72" marker-end="url(#arrowA)"/>
  <text class="lbl-edge" x="659" y="62" text-anchor="middle" font-size="11">reads &amp; writes data</text>
  <rect class="n-box" x="740" y="40" width="300" height="64" rx="6"/>
  <text class="lbl-title" x="890" y="66" text-anchor="middle" font-size="13">Postgres + pgvector</text>
  <text class="lbl-mono" x="890" y="84" text-anchor="middle" font-size="11">Supabase</text>

  <line class="e-line" x1="580" y1="180" x2="738" y2="180" marker-end="url(#arrowA)"/>
  <text class="lbl-edge" x="659" y="170" text-anchor="middle" font-size="11">rate limits</text>
  <rect class="n-box" x="740" y="148" width="300" height="64" rx="6"/>
  <text class="lbl-title" x="890" y="174" text-anchor="middle" font-size="13">Redis</text>
  <text class="lbl-mono" x="890" y="192" text-anchor="middle" font-size="11">Upstash</text>

  <line class="e-key" x1="580" y1="288" x2="738" y2="288" marker-end="url(#arrowAKey)"/>
  <text class="lbl-edge" x="659" y="278" text-anchor="middle" font-size="11">chat generation</text>
  <rect class="n-external" x="740" y="256" width="300" height="64" rx="6"/>
  <text class="lbl-title" x="890" y="282" text-anchor="middle" font-size="13">Gemini API</text>
  <text class="lbl-mono" x="890" y="300" text-anchor="middle" font-size="11">Google Cloud</text>

  <line class="e-key" x1="580" y1="396" x2="738" y2="396" marker-end="url(#arrowAKey)"/>
  <text class="lbl-edge" x="659" y="386" text-anchor="middle" font-size="11">embeds text</text>
  <rect class="n-external" x="740" y="364" width="300" height="64" rx="6"/>
  <text class="lbl-title" x="890" y="390" text-anchor="middle" font-size="13">Ollama</text>
  <text class="lbl-mono" x="890" y="408" text-anchor="middle" font-size="11">nomic-embed-text</text>

  <line class="e-key" x1="580" y1="504" x2="738" y2="504" marker-end="url(#arrowAKey)"/>
  <text class="lbl-edge" x="659" y="494" text-anchor="middle" font-size="11">OAuth API calls</text>
  <rect class="n-external" x="740" y="472" width="300" height="64" rx="6"/>
  <text class="lbl-title" x="890" y="495" text-anchor="middle" font-size="12.5">Gmail · Calendar · Drive</text>
  <text class="lbl-title" x="890" y="512" text-anchor="middle" font-size="12.5">GitHub · Jira · Slack</text>
</svg>
