<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 980" width="1120" height="980" color="#1B2A4A">
  <title>How UnifyAI Actually Works</title>
  <desc>A hand-sketched flowchart: a message comes in, gets checked for a casual greeting, otherwise the model figures out which tool fits — a connected app, company documents, or neither, which falls back to a document search anyway. Whichever path it takes, Gemini writes the final answer, which is shown to the user with its source. A red-pen note calls out that this whole loop runs on every single message.</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&amp;family=Caveat:wght@400;600;700&amp;display=swap');
    .sk-box { fill: #F4F7FA; stroke: #1B2A4A; stroke-width: 2.2; }
    .sk-box-inner { fill: none; stroke: #1B2A4A; stroke-width: 1; opacity: .45; }
    .sk-diamond { fill: #F4F7FA; stroke: #1B2A4A; stroke-width: 2.2; }
    .sk-diamond-inner { fill: none; stroke: #1B2A4A; stroke-width: 1; opacity: .45; }
    .sk-line { stroke: #1B2A4A; stroke-width: 2.2; fill: none; stroke-linecap: round; }
    .sk-line-2 { stroke: #1B2A4A; stroke-width: 1; fill: none; opacity: .35; stroke-linecap: round; }
    .sk-dashed { stroke: #3B4C6B; stroke-width: 1.6; fill: none; stroke-dasharray: 7 7; stroke-linecap: round; }
    .sk-arrow { fill: none; stroke: #1B2A4A; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .sk-text { fill: #1B2A4A; font-family: "Architects Daughter", cursive; }
    .sk-text-sm { fill: #3B4C6B; font-family: "Architects Daughter", cursive; }
    .sk-title { fill: #1B2A4A; font-family: "Architects Daughter", cursive; font-size: 34px; }
    .sk-red { stroke: #C23B2E; fill: none; }
    .sk-red-text { fill: #C23B2E; font-family: "Caveat", cursive; font-weight: 700; }
  </style>
  <defs>
    <pattern id="graph" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#D7E3EE" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- paper + faint grid -->
  <rect x="0" y="0" width="1120" height="980" fill="#F7FAFC"/>
  <rect x="0" y="0" width="1120" height="980" fill="url(#graph)"/>

  <!-- title -->
  <text class="sk-title" x="90" y="52">how UnifyAI actually works</text>
  <path class="sk-line" d="M 92 66 C 220 71, 380 61, 520 68" fill="none"/>

  <!-- sticky note summary, top right -->
  <g transform="rotate(-2.4 1000 79)">
    <rect x="900" y="20" width="200" height="118" rx="3" class="sk-dashed" fill="#FFF6D8"/>
    <text class="sk-text" x="915" y="46" font-size="16">3 kinds of replies:</text>
    <text class="sk-text" x="915" y="72" font-size="15">• small talk</text>
    <text class="sk-text" x="915" y="96" font-size="15">• your connected apps</text>
    <text class="sk-text" x="915" y="120" font-size="15">• company documents</text>
  </g>

  <!-- 1. start bubble -->
  <g transform="rotate(-0.6 560 132)">
    <rect x="420" y="96" width="280" height="72" rx="30" class="sk-box"/>
    <rect x="424" y="94" width="273" height="76" rx="26" class="sk-box-inner"/>
    <text class="sk-text" x="560" y="126" text-anchor="middle" font-size="20">a message comes</text>
    <text class="sk-text" x="560" y="150" text-anchor="middle" font-size="20">in from someone</text>
  </g>

  <path class="sk-line" d="M 559 168 C 553 176, 566 180, 560 188" marker-end="none"/>
  <path class="sk-arrow" d="M 553 182 L 560 189 L 567 181" fill="none"/>

  <!-- 2. diamond: greeting? -->
  <g>
    <polygon class="sk-diamond" points="562,187 679,258 554,336 442,262"/>
    <polygon class="sk-diamond-inner" points="559,192 674,257 558,331 447,259"/>
    <text class="sk-text" x="560" y="252" text-anchor="middle" font-size="18">just a</text>
    <text class="sk-text" x="560" y="274" text-anchor="middle" font-size="18">greeting?</text>
  </g>

  <!-- yes -> reply warmly -->
  <path class="sk-line" d="M 679 258 C 715 250, 730 266, 760 260" fill="none"/>
  <path class="sk-arrow" d="M 748 252 L 761 260 L 749 268" fill="none"/>
  <text class="sk-text-sm" x="715" y="240" text-anchor="middle" font-size="16">yes</text>

  <g transform="rotate(1.1 890 258)">
    <rect x="760" y="220" width="260" height="76" rx="28" class="sk-box"/>
    <rect x="764" y="223" width="253" height="70" rx="24" class="sk-box-inner"/>
    <text class="sk-text" x="890" y="252" text-anchor="middle" font-size="19">reply warmly</text>
    <text class="sk-text" x="890" y="276" text-anchor="middle" font-size="19">— done!</text>
  </g>

  <!-- no -> which tool fits -->
  <path class="sk-line" d="M 554 336 C 546 350, 566 358, 558 372" fill="none"/>
  <path class="sk-arrow" d="M 551 366 L 559 373 L 566 365" fill="none"/>
  <text class="sk-text-sm" x="595" y="358" text-anchor="middle" font-size="16">no</text>

  <!-- 3. which tool fits -->
  <g transform="rotate(-0.8 560 411)">
    <rect x="430" y="372" width="260" height="78" rx="24" class="sk-box"/>
    <rect x="433" y="375" width="254" height="72" rx="20" class="sk-box-inner"/>
    <text class="sk-text" x="560" y="404" text-anchor="middle" font-size="19">model figures out</text>
    <text class="sk-text" x="560" y="428" text-anchor="middle" font-size="19">which tool fits</text>
  </g>

  <!-- fan out to 3 branches -->
  <path class="sk-line" d="M 480 450 C 380 466, 260 470, 195 488" fill="none"/>
  <path class="sk-arrow" d="M 205 476 L 194 489 L 209 493" fill="none"/>

  <path class="sk-line" d="M 560 450 C 556 462, 564 478, 560 488" fill="none"/>
  <path class="sk-arrow" d="M 552 480 L 560 489 L 568 480" fill="none"/>

  <path class="sk-line" d="M 640 450 C 740 466, 860 470, 925 488" fill="none"/>
  <path class="sk-arrow" d="M 913 480 L 926 489 L 911 493" fill="none"/>

  <!-- row 5: three branch boxes -->
  <g transform="rotate(-1.2 190 538)">
    <rect x="50" y="490" width="280" height="96" rx="22" class="sk-box"/>
    <rect x="53" y="493" width="274" height="90" rx="18" class="sk-box-inner"/>
    <text class="sk-text" x="190" y="522" text-anchor="middle" font-size="18">an app —</text>
    <text class="sk-text" x="190" y="546" text-anchor="middle" font-size="18">Gmail · Jira · Drive ·</text>
    <text class="sk-text" x="190" y="570" text-anchor="middle" font-size="18">Calendar · GitHub · Slack</text>
  </g>

  <g transform="rotate(0.7 560 538)">
    <rect x="420" y="490" width="280" height="96" rx="22" class="sk-box"/>
    <rect x="423" y="493" width="274" height="90" rx="18" class="sk-box-inner"/>
    <text class="sk-text" x="560" y="530" text-anchor="middle" font-size="19">company</text>
    <text class="sk-text" x="560" y="554" text-anchor="middle" font-size="19">documents</text>
  </g>

  <g transform="rotate(-0.5 930 538)">
    <rect x="790" y="490" width="280" height="96" rx="22" class="sk-box"/>
    <rect x="793" y="493" width="274" height="90" rx="18" class="sk-box-inner"/>
    <text class="sk-text" x="930" y="530" text-anchor="middle" font-size="18">not sure /</text>
    <text class="sk-text" x="930" y="554" text-anchor="middle" font-size="18">none of these fit</text>
  </g>

  <!-- row5 -> row6 -->
  <path class="sk-dashed" d="M 190 586 C 184 600, 196 616, 190 630" fill="none"/>
  <path class="sk-arrow" d="M 183 622 L 190 631 L 197 622" fill="none"/>

  <path class="sk-dashed" d="M 560 586 C 554 600, 566 616, 560 630" fill="none"/>
  <path class="sk-arrow" d="M 553 622 L 560 631 L 567 622" fill="none"/>

  <path class="sk-line" d="M 930 586 C 924 600, 936 616, 930 630" fill="none"/>
  <path class="sk-arrow" d="M 923 622 L 930 631 L 937 622" fill="none"/>

  <!-- row 6: reference / fallback -->
  <g transform="rotate(0.6 190 666)">
    <rect x="70" y="632" width="240" height="68" rx="18" class="sk-box"/>
    <text class="sk-text-sm" x="190" y="658" text-anchor="middle" font-size="16">calls that app's</text>
    <text class="sk-text-sm" x="190" y="680" text-anchor="middle" font-size="16">real API</text>
  </g>

  <g transform="rotate(-0.4 560 666)">
    <rect x="440" y="632" width="240" height="68" rx="18" class="sk-box"/>
    <text class="sk-text-sm" x="560" y="658" text-anchor="middle" font-size="16">searches pgvector</text>
    <text class="sk-text-sm" x="560" y="680" text-anchor="middle" font-size="16">(Supabase)</text>
  </g>

  <g transform="rotate(1 930 666)">
    <rect x="810" y="632" width="240" height="68" rx="18" class="sk-box"/>
    <text class="sk-text-sm" x="930" y="658" text-anchor="middle" font-size="16">try the document</text>
    <text class="sk-text-sm" x="930" y="680" text-anchor="middle" font-size="16">search anyway</text>
  </g>

  <!-- fallback merges into pgvector search -->
  <path class="sk-line" d="M 808 674 C 750 682, 730 668, 682 674" fill="none"/>
  <path class="sk-arrow" d="M 694 666 L 681 674 L 694 682" fill="none"/>
  <text class="sk-text-sm" x="745" y="698" text-anchor="middle" font-size="14">(same search)</text>

  <!-- row6 -> Gemini box -->
  <path class="sk-line" d="M 190 700 C 260 726, 380 726, 465 738" fill="none"/>
  <path class="sk-arrow" d="M 452 733 L 466 739 L 454 748" fill="none"/>

  <path class="sk-line" d="M 560 700 C 556 714, 564 726, 562 738" fill="none"/>
  <path class="sk-arrow" d="M 554 730 L 562 739 L 570 730" fill="none"/>

  <!-- Gemini writes the answer -->
  <g transform="rotate(-0.7 570 777)">
    <rect x="430" y="736" width="280" height="82" rx="24" class="sk-box"/>
    <rect x="433" y="739" width="274" height="76" rx="20" class="sk-box-inner"/>
    <text class="sk-text" x="570" y="770" text-anchor="middle" font-size="19">Gemini writes</text>
    <text class="sk-text" x="570" y="794" text-anchor="middle" font-size="19">the answer</text>
  </g>

  <path class="sk-line" d="M 570 818 C 564 828, 580 838, 574 846" fill="none"/>
  <path class="sk-arrow" d="M 566 838 L 575 847 L 583 838" fill="none"/>

  <!-- final bubble -->
  <ellipse cx="580" cy="888" rx="175" ry="60" fill="#FFE9A8" opacity="0.45"/>
  <g transform="rotate(0.5 580 888)">
    <rect x="440" y="846" width="280" height="84" rx="26" class="sk-box"/>
    <rect x="443" y="849" width="274" height="78" rx="22" class="sk-box-inner"/>
    <text class="sk-text" x="580" y="880" text-anchor="middle" font-size="19">answer + source</text>
    <text class="sk-text" x="580" y="904" text-anchor="middle" font-size="19">shown to you</text>
  </g>

  <!-- red pen annotation circling the payoff -->
  <path class="sk-red" d="M 420 852 C 380 878, 385 918, 440 928 C 510 940, 640 940, 705 924 C 750 912, 748 866, 700 850 C 630 828, 490 828, 420 852 Z" stroke-width="2.6" fill="none"/>
  <path class="sk-red" d="M 725 895 C 755 900, 775 892, 800 896" stroke-width="2.2" fill="none"/>
  <path class="sk-red" d="M 787 890 L 801 896 L 787 903" stroke-width="2.2" fill="none"/>
  <text class="sk-red-text" x="808" y="882" font-size="23">this whole loop</text>
  <text class="sk-red-text" x="808" y="910" font-size="23">runs on every message</text>
</svg>
