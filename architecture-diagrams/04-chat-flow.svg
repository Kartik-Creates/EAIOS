<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 700" width="940" height="700" color="#171B24">
  <title>UnifyAI — Answering a Question (Chat Pipeline)</title>
  <desc>A user query first checks whether it's a casual greeting, answered directly; otherwise the model chooses whether to call a tool. If no tool applies, the query falls back to a direct document search, which either returns a cited grounded answer or logs the question as unanswered. If a tool is chosen, the backend executes it and the model turns the result into a final answer with citations, confidence, and a source label.</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .n-box { fill: #FFFFFF; stroke: #171B24; stroke-width: 1.4; }
    .n-diamond { fill: #FFFFFF; stroke: #171B24; stroke-width: 1.4; }
    .n-terminal { fill: #EEF0FE; stroke: #4338CA; stroke-width: 1.6; }
    .e-line { stroke: #171B24; stroke-width: 1.3; fill: none; }
    .lbl { fill: #171B24; font-family: "IBM Plex Sans", sans-serif; }
    .lbl-title { fill: #171B24; font-family: "IBM Plex Sans", sans-serif; font-weight: 600; }
    .lbl-edge { fill: #3A4051; font-family: "IBM Plex Mono", monospace; }
  </style>
  <defs>
    <marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
  </defs>

  <rect class="n-box" x="420" y="16" width="160" height="44" rx="6"/>
  <text class="lbl-title" x="500" y="43" text-anchor="middle" font-size="12.5">User query</text>
  <line class="e-line" x1="500" y1="60" x2="500" y2="94" marker-end="url(#arrowD)"/>

  <polygon class="n-diamond" points="500,96 566,140 500,184 434,140"/>
  <text class="lbl" x="500" y="136" text-anchor="middle" font-size="11.5">Casual</text>
  <text class="lbl" x="500" y="150" text-anchor="middle" font-size="11.5">greeting?</text>

  <line class="e-line" x1="566" y1="140" x2="680" y2="140" marker-end="url(#arrowD)"/>
  <text class="lbl-edge" x="623" y="132" text-anchor="middle" font-size="10.5">yes</text>
  <rect class="n-terminal" x="682" y="110" width="230" height="60" rx="6"/>
  <text class="lbl-title" x="797" y="135" text-anchor="middle" font-size="12">Warm reply,</text>
  <text class="lbl-title" x="797" y="153" text-anchor="middle" font-size="12">generated directly</text>

  <line class="e-line" x1="500" y1="184" x2="500" y2="216" marker-end="url(#arrowD)"/>
  <text class="lbl-edge" x="518" y="205" font-size="10.5">no</text>

  <rect class="n-box" x="400" y="218" width="200" height="56" rx="6"/>
  <text class="lbl" x="500" y="242" text-anchor="middle" font-size="12">Model decides: call a</text>
  <text class="lbl" x="500" y="260" text-anchor="middle" font-size="12">tool, or answer directly</text>

  <line class="e-line" x1="500" y1="274" x2="500" y2="306" marker-end="url(#arrowD)"/>

  <polygon class="n-diamond" points="500,308 566,352 500,396 434,352"/>
  <text class="lbl" x="500" y="348" text-anchor="middle" font-size="11.5">Tool</text>
  <text class="lbl" x="500" y="362" text-anchor="middle" font-size="11.5">chosen?</text>

  <line class="e-line" x1="434" y1="352" x2="330" y2="352" marker-end="url(#arrowD)"/>
  <text class="lbl-edge" x="382" y="344" text-anchor="middle" font-size="10.5">no</text>
  <rect class="n-box" x="100" y="322" width="230" height="60" rx="6"/>
  <text class="lbl" x="215" y="347" text-anchor="middle" font-size="12">Search company documents</text>
  <text class="lbl" x="215" y="365" text-anchor="middle" font-size="12">directly (Step 3 fallback)</text>

  <line class="e-line" x1="215" y1="382" x2="215" y2="414" marker-end="url(#arrowD)"/>
  <polygon class="n-diamond" points="215,416 271,454 215,492 159,454"/>
  <text class="lbl" x="215" y="450" text-anchor="middle" font-size="10.5">Relevant</text>
  <text class="lbl" x="215" y="463" text-anchor="middle" font-size="10.5">chunks found?</text>

  <line class="e-line" x1="180" y1="480" x2="120" y2="524" marker-end="url(#arrowD)"/>
  <text class="lbl-edge" x="125" y="508" font-size="10.5">yes</text>
  <rect class="n-terminal" x="30" y="526" width="180" height="62" rx="6"/>
  <text class="lbl-title" x="120" y="551" text-anchor="middle" font-size="11.5">Cited, grounded</text>
  <text class="lbl-title" x="120" y="568" text-anchor="middle" font-size="11.5">answer</text>

  <line class="e-line" x1="245" y1="480" x2="300" y2="524" marker-end="url(#arrowD)"/>
  <text class="lbl-edge" x="298" y="508" font-size="10.5">no</text>
  <rect class="n-terminal" x="220" y="526" width="160" height="62" rx="6"/>
  <text class="lbl-title" x="300" y="548" text-anchor="middle" font-size="11.5">Logged for review,</text>
  <text class="lbl-title" x="300" y="565" text-anchor="middle" font-size="11.5">apology message</text>

  <line class="e-line" x1="500" y1="396" x2="500" y2="428" marker-end="url(#arrowD)"/>
  <text class="lbl-edge" x="518" y="417" font-size="10.5">yes</text>

  <rect class="n-box" x="400" y="430" width="200" height="60" rx="6"/>
  <text class="lbl" x="500" y="454" text-anchor="middle" font-size="11.5">Run the tool — app API call</text>
  <text class="lbl" x="500" y="472" text-anchor="middle" font-size="11.5">or company document search</text>

  <line class="e-line" x1="500" y1="490" x2="500" y2="522" marker-end="url(#arrowD)"/>
  <rect class="n-box" x="400" y="524" width="200" height="60" rx="6"/>
  <text class="lbl" x="500" y="548" text-anchor="middle" font-size="11.5">Model turns the result into</text>
  <text class="lbl" x="500" y="566" text-anchor="middle" font-size="11.5">a natural-language sentence</text>

  <line class="e-line" x1="500" y1="584" x2="500" y2="616" marker-end="url(#arrowD)"/>
  <rect class="n-terminal" x="370" y="618" width="260" height="64" rx="6"/>
  <text class="lbl-title" x="500" y="644" text-anchor="middle" font-size="12">Answer + citations +</text>
  <text class="lbl-title" x="500" y="662" text-anchor="middle" font-size="12">confidence + source</text>
</svg>
