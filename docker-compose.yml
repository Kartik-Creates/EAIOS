version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: eaios-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eaios_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eaios_password}
      POSTGRES_DB: ${POSTGRES_DB:-eaios_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eaios_user} -d ${POSTGRES_DB:-eaios_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eaios-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eaios-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-eaios_user}:${POSTGRES_PASSWORD:-eaios_password}@postgres:5432/${POSTGRES_DB:-eaios_db}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-changeme_in_production_secret_key_32chars}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eaios-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
